<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>体育冠军与世界纪录</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>体育冠军与世界纪录</h1>
        <p id="meta">正在加载数据...</p>
      </div>
      <button id="refreshButton" type="button">立即刷新</button>
    </header>

    <main>
      <section class="filters" aria-label="筛选">
        <input id="searchInput" type="search" placeholder="搜索项目、冠军、纪录、地区" autocomplete="off" />
        <select id="categorySelect">
          <option value="">全部分类</option>
        </select>
      </section>

      <section class="summary" id="summary"></section>
      <section class="grid" id="sportsGrid" aria-live="polite"></section>
    </main>

    <dialog id="detailDialog">
      <div class="dialogHeader">
        <div>
          <h2 id="dialogTitle"></h2>
          <p id="dialogSubTitle"></p>
        </div>
        <button id="closeDialog" type="button" aria-label="关闭">×</button>
      </div>
      <div id="dialogBody"></div>
    </dialog>

    <script src="/app.js" type="module"></script>
  </body>
</html>
